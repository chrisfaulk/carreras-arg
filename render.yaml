services:
  - type: web
    name: carreras-arg-api
    runtime: node
    buildCommand: pnpm install --frozen-lockfile && pnpm --filter @carreras-arg/backend build
    preDeployCommand: pnpm --filter @carreras-arg/backend exec prisma migrate deploy
    startCommand: pnpm --filter @carreras-arg/backend start
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: NEXT_PUBLIC_API_URL
        sync: false
      - key: ADMIN_SEED_EMAIL
        sync: false
      - key: ALLOWLIST_IPS
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: PORT
        value: 3001
