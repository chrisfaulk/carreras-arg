name: ci

on:
  push:
  pull_request:

jobs:
  build-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm build
      - name: anti-PATCH
        run: |
          ! grep -rn "Patch(" backend frontend --include="*.ts" --include="*.tsx"
          ! grep -rn "method: 'PATCH'" backend frontend --include="*.ts" --include="*.tsx"
          ! grep -rn 'method: "PATCH"' backend frontend --include="*.ts" --include="*.tsx"
